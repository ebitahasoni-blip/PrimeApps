name: Build and Deploy APK to Subdomain

on:
  push:
    branches:
      - main # Triggers compilation every time you push code to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Change to 21 if your project requires it
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Move APK to Web Root
        run: |
          # Finds the built APK and copies it to the root directory as 'app-release.apk'
          cp app/build/outputs/apk/release/app-release.apk ./app-release.apk

      - name: Deploy static files to GitHub Pages
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5 # Or any GitHub Pages deployment action
        # Alternatively, use GitHub's official Pages deployment actions:
